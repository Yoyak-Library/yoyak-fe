    position: relative;
    width: 382px;
    left: 50%;

}

.login-title {

}

    color: #767676;
    font-weight: 500;
}

    width: 100%;
    height: 108px;
    position: relative;
}

    color: #767676;
    margin-bottom: 8px;
    font-weight: 500;
}

    font-size: 1.6em;

    border-color: #699BF7;
}

    right: 15px;

.login-content-warn {
    font-size: 1.2em;
    color: #EA1215;
}

    height: 44px;
    line-height: 44px;
    cursor: pointer;
    color: #191919;
    position: relative;
}

.login-submit-kakao img {

}

    text-align: center;

    margin: 14px 0px;
}

.home__content-title {
    margin: 16px 0px;
    font-weight: 600;
    font-size: 34px;
}

.home__content-description {
    margin: 8px 0px;
    font-weight: 500;
    font-size: 16px;
    text-align: center;
}

.home__main-button {
    margin: 10px 0;
}

.home__main-button {
    display: flex;          /* 버튼을 가로로 배치 */
    justify-content: space-between; /* 버튼 사이 간격을 일정하게 유지 */
    gap: 10px;              /* 버튼 간의 간격 조정 (선택 사항) */
}

.home__button {
    display: inline-flex;                /* 버튼 내의 요소들을 가로로 배치 */
    align-items: center;          /* 아이콘과 텍스트 세로로 가운데 정렬 */
    justify-content: center;      /* 아이콘과 텍스트 사이의 간격을 일정하게 맞춤 */
    gap: 8px;                     /* 아이콘과 텍스트 사이의 간격 */
    background-color: #DBE7FF;    /* 버튼 배경 색 */
    border: none;                 /* 기본 버튼 테두리 제거 */
    border-radius: 5px;           /* 버튼 모서리 둥글게 */
    font-size: 16px;              /* 버튼 글자 크기 */
    cursor: pointer;             /* 버튼 클릭 시 커서 모양 변경 */
    text-align: center;           /* 버튼 텍스트 가운데 정렬 */
    padding: 12px 24px;
}

.home__icon {
    /* 여기에 아이콘 스타일 추가 */
    width: 20px;                 /* 아이콘 크기 */
    height: 20px;                /* 아이콘 크기 */
    background-size: contain;    /* 아이콘 비율 유지 */
    background-repeat: no-repeat; /* 아이콘 반복 방지 */
}

.home__text {
    font-size: 15px;              /* 텍스트 크기 */
    font-weight: 600;
    font-family: 'Pretendard', sans-serif;
}

.home__summary {
    width: 1040px;        /* 너비 1040px로 고정 */
    margin: 0 auto;       /* 부모 안에서 가로 중앙 정렬 */
    padding: 40px 0 0 0;      /* 상하 여백을 추가 */
}

.home__summary-title {
    font-size: 24px;
    font-weight: 600;
}

.home__summary-component {
    margin: 16px 0px;
    display: flex;
    justify-content: space-between; /* 컴포넌트 간 간격을 일정하게 유지 */
}

    min-width: 800px;
    font-family: 'Pretendard', sans-serif;
}

.navi-logo {
    width: 130px; /* 적절한 크기 설정 */

    object-fit: contain; /* 비율을 유지하면서 크기 조정 */
    margin: 0 30px 0 0px;
}

.navi-space-between {
    display: flex;
    justify-content: space-between;
    width: 100%; /* 부모 요소의 너비를 따라감 */
    max-width: 1200px; /* 최대 너비 제한 */

.navi-button2 {
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.navi-first {
    font-weight: 500;
    font-size: clamp(14px, 1.5vw, 18px); /* 최소 16px, 최대 20px */
    margin: 0 30px;
    color: #5B5B5B;
    cursor: pointer;
    display: flex;
    align-items: center;
    position: relative; /* '::after' 요소가 정상적으로 위치하도록 설정 */
}

.navi-first.active {
    font-weight: 600;
    color: #333;
    position: relative;
}

.navi-first.active::after {
    content: ''; 
    position: absolute;
    bottom: -6px;
    left: 0;
    width: 100%;
    height: 2px;
    background-color: #333;
}


.navi-second {
    font-weight: 500;
    font-size: clamp(14px, 1.5vw, 18px); /* 최소 14px, 최대 18px */
    margin: 0 8px; /* 간격 추가 */
    cursor: pointer;
    display: flex;
    align-items: center;
}

.navi-third {
    font-weight: 500;
    font-size: clamp(14px, 1.5vw, 18px); /* 최소 14px, 최대 18px */
    margin: 0 5px; /* 간격 추가 */

    display: flex;
    align-items: center;
}

#nick {
    font-weight: 600;

}

@media (max-width: 800px) {
    .navi-space-between {
        flex-direction: row; /* 작은 화면에서는 세로로 쌓음 */
        align-items: center;
        width: 100%;

    .navi-first,

    .navi-third {

    }

    .navi-logo {
        width: 100px; /* 작은 화면에서는 로고 크기 줄임 */
        margin-right: 15px;
    }

    display: flex;
    flex-direction: column;
    font-size: 10px;
    min-width: 800px;

.yoyak-container {
    width: 800px;
    margin: auto;
}

.yoyak-mainImg {
    width: 800px;
    height: 440px;
}

.yoyak-intro {
    background-color: rgb(255, 255, 255);
    width: calc(100% - 16px);
    height: 254px;
    padding: 0px 8px;
    margin-top: 24px;
    border-bottom: 2px solid #F3F3F3;
    position: relative;
}

.yoyak-intro-name {
    font-size: 2.8em;
    font-weight: 600;
    color: #333333;
}

.yoyak-intro-count {
    font-size: 1.4em;
    font-weight: 600;
    color: #7C7C7C;
    margin-top: 8px;
}

.yoyak-intro-content {
    font-size: 1.8em;
    color: #333333;
    margin-top: 16px;
}

.yoyak-intro-hashtag {
    position: absolute;
    left: 8px;
    bottom: 42px;
    font-size: 2em;
    font-weight: 600;
    color: #5D91FE;
}

.yoyak-intro-badge {
    position: absolute;
    top: 0px;
    right: 8px;
    width: 143px;
    height: 28px;
    font-size: 1.3em;
    font-weight: 600;
    color: #7C7C7C;
    display: flex;
    align-items: center;
}

.yoyak-intro-badge img {
    width: 28px;
    height: 28px;
    margin-right: 12px;
}

.yoyak-intro-btns {
    position: absolute;
    right: 8px;
    bottom: 32px;
    width: 323px;
    display: flex;
    justify-content: space-between;
}

.yoyak-intro-btn {
    height: 44px;
    background-color: #5D91FE;
    color: #F5F7FA;
    font-weight: 600;
    font-size: 1.5em;
    border-radius: 8px;
    cursor: pointer;
    display: flex;
    align-items: center;
}

.yoyak-intro-btns #yoyak {
    width: 128px;
}

.yoyak-intro-btns #review {
    width: 187px;
}

.yoyak-intro-btns #yoyak img,
.yoyak-intro-btns #review img {
    width: 20px;
    height: 20px;
    margin-left: 24px;
    margin-right: 8px;
}

.yoyak-summary {
    position: relative;
    overflow: hidden;
}

.yoyak-summary-rank {
    position: absolute;
    width: 131px;
    height: 17px;
    top: 16px;
    right: 17px;
    display: flex;
    font-size: 12px;
    color: #7E7E7E;
    justify-content: space-between
}

.yoyak-summary-popular,
.yoyak-summary-regist,
.yoyak-summary-suggest {
    width: 34px;
    cursor: pointer;
    text-align: center;
}

.yoyak-summary-rank #active {
    color: #202020;
    border-bottom: 1px solid #5D91FE;
}

.yoyak-summary-component {
    margin-top: 52px;
}

.yoyak-summary-component hr {
    margin: 23px 0px;
    width: 100%;
    border: 1px solid #F3F3F3;
}

.yoyak-summary-more {
    width: 140px;
    height: 52px;
    background-color: #5D91FE;
    color: #fff;
    font-weight: 600;
    line-height: 52px;
    text-align: center;
    font-size: 1.8em;
    border-radius: 8px;
    margin: auto;
    margin-top: 56px;
    margin-bottom: 121px;
    cursor: pointer;
}

.yoyak-filter {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(calc(-50% + 568px), calc(-50% ));
    width: 240px;
    height: 320px;
    color: #333333;
}

.yoyak-filter-name {
    font-size: 1.8em;
    font-weight: 800;
}

.yoyak-filter-reset {
    font-size: 1.4em;
    position: absolute;
    top: 0px;
    right: 0px;
    display: flex;
    align-items: center;
    cursor: pointer;
}

.yoyak-filter-reset img {
    width: 20px;
    height: 20px;
}

.yoyak-filter hr {
    border: 0;
    height: 2px;
    background-color: #F3F3F3;
    margin-top: 5px;
    margin-bottom: 18px;
}

.yoyak-filter-length,
.yoyak-filter-range,
.yoyak-filter-spoiler {
    font-size: 1.6em;
}

.yoyak-filter-length,
.yoyak-filter-range {
    margin-bottom: 24px;
}

.yoyak-filter-name2 {
    font-weight: 600;
    margin-bottom: 17px;
}

.yoyak-filter-checkbox {
    display: flex;
    align-items: center;
    margin-top: 8px;
}

.yoyak-filter input[type="checkbox"] {
    appearance: none;
    width: 20px;
    height: 20px;
    margin: 0px;
    border: 1px solid #5D91FE;
    border-radius: 4px;
    margin-right: 8px;
    cursor: pointer;
}

.yoyak-filter input[type="checkbox"]:checked {
    background-color: #5D91FE;
}

.yoyak-filter input[type="checkbox"]:checked::before {
    content: '';
    width: 6px;
    height: 12px;
    border-bottom: 2px solid #ffffff;
    border-right: 2px solid #ffffff;
    transform: rotate(45deg);
    position: absolute;
    margin-left: 5px;
    color: #fff;
}

.yoyak-filter input[type="text"] {
    width: 100%;
    border: none;
    color: #333333;
    font-size: 13px;
    outline: none;
    cursor: pointer;
    line-height: 19px;
    border-bottom: 1px solid #989898;
    background-color: transparent;
    padding: 0px;
}

.yoyak-filter input[type="text"]::placeholder {
    color: #767676;
}

.yoyak-filter input[type="text"]:focus {
    border: none;
    outline: none;

.viewYoyak-title a {
    text-decoration: none;
    color: #000;

}

.viewYoyak-subtitle {
    color: #7C7C7C;
    text-align: center;
    font-size: 17px;
    font-weight: 600;
    margin-top: 8px;
}

.viewYoyak-view {
    width: 100%;
    height: 690px;
    border-radius: 8px;
    background: var(--BackGround, #F5F7FA);

    padding: 24px 24px 0px 24px;
    box-sizing: border-box;
    position: relative;
    margin-top: 28px;
}

.viewYoyak-profile {
    display: flex;
    height: 40px;
}

.viewYoyak-profile img {
    width: 40px;

}

.viewYoyak-nick {
    color: #000;

    font-weight: 600;

}

.viewYoyak-time {
    color: #A6A6A6;
    font-size: 13px;
    font-weight: 500;
}

.viewYoyak-dropdownName {
    position: absolute;
    top: 88px;
    color: #000;
    font-size: 20px;
    font-weight: 600;
}

.viewYoyak-dropdown {
    width: 752px;
    height: 40px;
    gap: 8px;
    border-radius: 8px;
    background: var(--White, #FFF);
    display: flex;
    align-items: center;
    font-family: Pretendard;
    font-size: 20px;
    font-weight: 500;
    color: #000;
}

.viewYoyak-dropdown img {
    width: 24px;
    height: 24px;
    margin-left: 8px;
    cursor: pointer;
}

.viewYoyak-dropdown-episode {
    color: #2969F0;
}

.viewYoyak-dropdown-episodes {
    position: absolute;
    top: 43px;
    width: 127px;
    max-height: 260px;
    overflow-y: auto;
    border-radius: 8px;
    background-color: #FFF;
    box-shadow: 0px 4px 12px 0px rgba(0, 0, 0, 0.04);
    z-index: 1;
}

.viewYoyak-dropdown-episodes::-webkit-scrollbar {
    width: 6px;
}

.viewYoyak-dropdown-episodes::-webkit-scrollbar-thumb {
    background-color: #ccc;
    border-radius: 6px;
}

.viewYoyak-dropdown-episodes::-webkit-scrollbar-track {
    background: transparent;
}

.viewYoyak-dropdown-num {
    height: 52px;
    display: flex;
    align-items: center;
    color: var(--Black, #333);
    font-size: 16px;
    font-weight: 500;
    gap: 8px;
}

.viewYoyak-dropdown-num input[type="radio"] {
    width: 20px;
    height: 20px;
    margin-left: 16px;
}

.viewYoyak-dropdown-num span{
    padding-top: 4px;
}

.viewYoyak-dropdownbar {
    position: absolute;
}

.viewYoyak-dropdownPosition {
    position: absolute;
    top: 136px;
}

.viewYoyak-content {
    position: absolute;
    top: 196px;
    padding: 0px 40px;
    color: var(--Black, #333);
    font-size: 18px;
    font-weight: 500;
    line-height: 125%;
    max-height: 440px;
    overflow-y: auto;
}


.viewYoyak-content::-webkit-scrollbar {
    width: 6px;
}

.viewYoyak-content::-webkit-scrollbar-thumb {
    background-color: #ccc;
    border-radius: 6px;
}

.viewYoyak-content::-webkit-scrollbar-track {
    background: transparent;
}


.viewYoyak-comment {
    position: relative;
    width: 100%;
    height: 500px;
}

.viewYoyak-comment-write {
    position: absolute;
    top: 24px;
    width: 100%;
    height: 154px;
    border-radius: 8px;
    border: 2px solid var(--BackGround, #F5F7FA);
    padding: 16px;
    box-sizing: border-box;
    text-align: left;
    vertical-align: top;
    font-size: 15px;
    font-weight: 400;
    resize: none;
    font-family: Pretendard;
}

.viewYoyak-comment-write::placeholder {
    color: var(--Gray-60, #767676);
}

.viewYoyak-comment-write:focus {
    outline: none;
}


.viewYoyak-comment-registration {
    position: absolute;
    top: 128px;
    right: 15px;
    width: 105px;
    height: 38px;
    text-align: center;
    line-height: 38px;

    color: var(--Blue-100, #5D91FE);
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
}

.viewYoyak-comment-sort {
    position: absolute;
    top: 198px;
    left: 24px;
}

.viewYoyak-comment-rank {
    width: 120px;

}

.viewYoyak-comment-popular,
.viewYoyak-comment-regist {
    width: 50px;

.viewYoyak-comment-rank #active {

    height: auto;

}

.comment-profile {

}

.comment-profile img {
    width: 40px;
    height: 40px;
    margin-right: 8px;
}

.comment-nick {
    color: #000;
    font-size: 15px;
    font-weight: 600;
    margin-top: 3px;
}

.comment-time {
    color: #A6A6A6;
    font-size: 13px;
    font-weight: 500;
}

.comment-content {
    width: 100%;
    padding: 0px 48px;
    box-sizing: border-box;
    color: var(--Black, #333);
    font-size: 18px;
    font-weight: 400;
    margin-bottom: 22px;
}

.comment-bottom {
    display: flex;
    gap: 8px;
}

.comment-thumbs,
.comment-reply {
    display: flex;
    align-items: center;
    color: #797979;
    font-size: 15px;
    font-weight: 400;
    gap: 4px;
    cursor: pointer;
}

.comment-thumbs img,
.comment-reply img {
    width: 24px;
    height: 24px;
}

.reply {
    width: 777px;
    height: auto;
    position: relative;
    display: flex;
    margin-top: 16px;
}

.reply-img {
    width: 24px;
    height: 24px;
    margin-left: 8px;
    margin-right: 16px;
}











.viewYoyak-heart {
    position: absolute;
    bottom: 16px;
    left: 24px;
    color: #535353;
    font-size: 15px;
    font-weight: 400;
    display: flex;
    align-items: center;
}

.viewYoyak-heart img {
    width: 24px;
    height: 24px;
    margin-right: 8px;
    cursor: pointer;
}

.viewYoyak-highlight {
    width: 48px;
    height: 48px;
    border-radius: 24px;
    background: #FFF;
    box-shadow: 0px 2px 5.5px 0px rgba(0, 0, 0, 0.05);
    display: flex;
    position: absolute;
    bottom: 100px;
    right: 16px;
    cursor: pointer;
}

.viewYoyak-highlight img {
    width: 32px;
    height: 32px;
    margin: auto;
}

.viewYoyak-highlight-colors {

    width: 196px;
    height: 36px;
    align-items: center;
    border-radius: 24px;

    box-shadow: 0px 2px 5.5px 0px rgba(0, 0, 0, 0.05);

    right: 80px;
    padding: 0px 16px;

}

.viewYoyak-highlight-item {
    position: relative;
}

.viewYoyak-highlight-blank {

    height: 10px;

    top: 5px;
    left: 5px;

}

.viewYoyak-highlight-color {

    display: flex;
    flex-direction: column;
    font-size: 10px;
    min-width: 800px;
}

.review__container {
    width: 800px;
    margin: auto;
}

.review__mainImg {
    width: 800px;
    height: 270px;
    object-fit: cover;
}

.review__intro {
    background-color: rgb(255, 255, 255);
    width: calc(100% - 16px);
    height: auto;
    padding: 0px 8px;
    margin-top: 24px;
    position: relative;
}

.review__intro-name {
    font-size: 2.8em;
    font-weight: 600;
    color: #333333;
}

.review__intro-content {
    font-size: 17px;
    color: #7C7C7C;
    margin: 8px 0px;
    font-family: 'Pretendard', sans-serif;
    font-weight: 600;
}

.review__component-container {
    padding: 0px 8px; 
    position: relative;
    overflow: hidden;
}


.review__component {
    margin-top: 52px;
    border: 1.3px solid #EDF3FF;
    border-radius: 4px; /* 모서리를 둥글게 하려면 추가 */
    padding: 16px;
}

.review__more {
    width: 140px;
    height: 52px;
    background-color: #5D91FE;
    color: #fff;
    font-weight: 600;
    line-height: 52px;
    text-align: center;
    font-size: 1.8em;
    border-radius: 8px;
    margin: auto;
    margin-top: 56px;
    margin-bottom: 121px;
    cursor: pointer;
}

.review__input-container {
    width: 100%;
    height: 154px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    align-items: flex-start;
    border: 1px solid #BFD4FF;
    border-radius: 4px;
    position: relative;
}

.review__input {
    width: 96%;
    height: 90px;
    border: none;
    resize: none;
    outline: none;
    border-radius: 5px;
    padding: 15px;
    font-size: 15px;
    font-family: 'Pretendard', sans-serif;
}

.review__rating {
    display: flex;
    padding-left: 10px;
}

.review__star {
    margin-bottom: 8px;
    font-size: 20px;
    cursor: pointer;
    display: inline-block;
    padding: 2px;
    width: 20px;
    height: 20px;
    color: #d3d3d3;
    /* 기본 회색 별 */
    transition: color 0.2s ease;
}

.review__star.full {
    color: #FFD93F;
    /* 완전 채워진 별은 금색 */
}

.review__star.half {
    background: linear-gradient(to right, gold 50%, #d3d3d3 50%);
    -webkit-background-clip: text;
    /* Chrome, Safari */
    background-clip: text;
    /* 표준 */
    color: transparent;
    /* 배경만 보여지게 */
}


.review__star:before {
    content: "★";
}

.review__footer {
    display: flex;
    justify-content: space-between;
    /* 요소들을 양쪽 끝으로 배치 */
    align-items: end;
    /* 세로 정렬 */
    width: 100%;
}

.review__right {
    display: flex;
    justify-content: flex-end;
    align-items: end;
}

.review__status {
    margin-bottom: 12px;
    font-size: 14px;
    color: #5D91FE;
    margin-right: 8px;
    /* 버튼과 간격 */
}

.review__submit {
    margin: 8px;
    padding: 12px 24px;
    background-color: #5D91FE;
    color: white;
    border: none;
    border-radius: 5px;
    cursor: pointer;
    font-size: 14px;
    font-family: 'Pretendard', sans-serif;
}

.review__submit:hover {
    background-color: #5483E5;
}

.review__submit:active {
    background-color: #4A74CB;
}


.review-container {
    display: flex;
    flex-direction: column;
    padding: 8px 6px;
}

.review-header {
    display: flex;
    align-items: center;
    gap: 12px;
}

.review-profile {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    object-fit: cover;
}

.review-nickname {
    font-weight: bold;
    font-size: 15px;
}

.review-date {
    font-size: 13px;
    color: #888;
}

.review-text {
    margin: 12px 0px 6px 0px;
    font-size: 15px;
    color: #333;
    line-height: 1.5;
}

.review-footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.review-likes {
    display: flex;
    align-items: center;
    cursor: pointer;
    font-size: 14px;
    color: #555;
    gap: 4px;
}

.thumbsup-icon {
    width: 18px;
    height: 17px;
}

body, html {
    margin: 0;
    padding: 0;
    background-color: #ffffff; /* 전체 배경 흰색 */
    color: #333333; /* 글자 색상 */
    font-family: 'Pretendard', sans-serif;
    height: 100%; /* 화면 전체 높이 */
  }
  
  .Onboarding1 {
    text-align: center;
    padding: 20px;
    background-color: #ffffff; /* 배경 흰색 */
    color: #333333; /* 글자색 #333333 */
    min-height: 100vh; /* 화면 전체 높이 채움 */
    display: flex;
    flex-direction: column;
    justify-content: center; /* 세로 중앙 정렬 */
    align-items: center; /* 가로 중앙 정렬 */
    box-sizing: border-box; /* 여백 포함 계산 */
  }
  
  .progress-bar {
    width: 100%;
    max-width: 600px; /* 진행 바 최대 너비 */
    height: 8px;
    background-color: #f5f7fa;
    border-radius: 4px;
    margin-bottom: 20px;
    position: relative;
  }
  
  .progress-bar .progress {
    width: 50%;
    height: 100%;
    background-color: #5d91fe;
    border-radius: 4px;
  }
  
  .content {
    max-width: 600px;
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center; /* 내용 중앙 정렬 */
  }
  
  h1 {
    font-size: 24px;
    margin-bottom: 10px;
    text-align: left; /* 왼쪽 정렬 */
  }
  
  .content .header {
    display: flex;
    justify-content: space-between; /* 텍스트와 버튼을 양 끝에 배치 */
    align-items: center; /* 수직 중앙 정렬 */
    width: 100%;
  }
  
  .skip-button {
    background: none;
    border: none;
    color: #333333; /* 색상 */
    font-size: 12px; /* 글자 크기 축소 */
    padding: 2px 5px; /* 패딩 축소 */
    margin-bottom: 20px;
    cursor: pointer;
    text-align: right;
    width: 120px; /* 버튼 너비 축소 */
    height: 120px; /* 버튼 높이 축소 */
  }
  
  .skip-button img {
    width: 100%; /* 이미지를 버튼 크기에 맞게 조정 */
    height: auto;
  }
  
  .categories {
    text-align: left;
    margin-bottom: 16px;
  }
  
  .category {
    margin-bottom: 50px; /* 카테고리 사이 간격 증가 */
  }
  
  .category h2 {
    font-size: 18px;
    margin-bottom: 10px;
  }
  
  .options {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
  }
  
  .option {
    background-color: #f5f7fa;
    border: none;
    border-radius: 8px;
    padding: 10px 20px;
    cursor: pointer;
    font-size: 14px;
    color: #333333; /* 글자색 #333333 */
  }
  
  .option.selected {
    background-color: #EAF1FF;
    color: #4A7FEF;
  }
  
  .next-button {
    background-color: #f5f7fa;
    border: none;
    border-radius: 8px;
    padding: 10px 30px; /* 버튼 길이 증가 */
    font-size: 16px;
    cursor: pointer;
    color: #333333; /* 글자색 #333333 */
    transition: background-color 0.3s ease;
    margin-left: auto; /* 오른쪽 정렬 */
  }
  
  .next-button.active {
    background-color: #5d91fe;
    color: #ffffff;
  }
  
  .next-button:disabled {
    cursor: not-allowed;
    background-color: #f5f7fa;
    color: #aaa;

body, html {
    margin: 0;
    padding: 0;
    background-color: #ffffff; /* 전체 배경 흰색 */
    color: #333333; /* 글자 색상 */
    font-family: 'Pretendard', sans-serif;
    height: 100%; /* 화면 전체 높이 */
}

.Onboarding2 {
    text-align: center;
    padding: 20px;
    background-color: #ffffff; /* 배경 흰색 */
    color: #333333; /* 글자색 #333333 */
    min-height: 100vh; /* 화면 전체 높이 채움 */
    display: flex;
    flex-direction: column;
    justify-content: center; /* 세로 중앙 정렬 */
    align-items: center; /* 가로 중앙 정렬 */
    box-sizing: border-box; /* 여백 포함 계산 */
}

.progress-bar2 {
    width: 100%;
    max-width: 600px; /* 진행 바 최대 너비 */
    height: 8px;
    background-color: #5d91fe; /* 전체 진행 바 색상 변경 */
    border-radius: 4px;
    margin-bottom: 20px;
    position: relative;
}

.progress {
    width: 100%; /* 전체 채우기 */
    height: 100%;
    background-color: #5d91fe; /* 진행 바 색상 */
    border-radius: 4px;
}

.content {
    max-width: 600px;
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center; /* 내용 중앙 정렬 */
}

h1 {
    font-size: 24px;
    margin-bottom: 10px;
    text-align: left; /* 왼쪽 정렬 */
}

.content .header {
    display: flex;
    justify-content: space-between; /* 텍스트와 버튼을 양 끝에 배치 */
    align-items: center; /* 수직 중앙 정렬 */
    width: 100%;
}

.skip-button {
    background: none;
    border: none;
    color: #333333; /* 색상 변경 */
    font-size: 14px;
    margin-bottom: 20px;
    cursor: pointer;
    text-align: right; /* 오른쪽 정렬 */
}

.categories {
    text-align: left;
    margin-bottom: 16px;
}

.category {
    margin-bottom: 50px; /* 카테고리 사이 간격 증가 */
}

.category h2 {
    font-size: 18px;
    margin-bottom: 10px;
}

.options {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
}

.option {
    background-color: #f5f7fa;
    border: none;
    border-radius: 8px;
    padding: 10px 20px;
    cursor: pointer;
    font-size: 14px;
    color: #333333; /* 글자색 #333333 */
}

.option.selected {
    background-color: #EAF1FF;
    color: #4A7FEF;
}

.next-button {
    background-color: #f5f7fa;
    border: none;
    border-radius: 8px;
    padding: 10px 30px; /* 버튼 길이 증가 */
    font-size: 16px;
    cursor: pointer;
    color: #333333; /* 글자색 #333333 */
    transition: background-color 0.3s ease;
    margin-left: auto; /* 오른쪽 정렬 */
}

.next-button.active {
    background-color: #5d91fe;
    color: #ffffff;
}

.next-button:disabled {
    cursor: not-allowed;
    background-color: #f5f7fa;
    color: #aaa;

    display: flex;
    flex-direction: column;
    font-size: 10px;
    min-width: 800px;
}

.myPost-container {
    width: 800px;
    margin: auto;
    position: relative;
}

.myPost-pageName {
    position: absolute;
    display: flex;
    align-items: center;
    color: #000;
    font-size: 24px;
    font-weight: 600;
    gap: 16px;
    top: 81px;
}

.myPost-pageName img {
    width: 32px;
    height: 32px;
    cursor: pointer;
}

.myPost-menu {
    position: absolute;
    display: flex;
    top: 137px;
    left: 8px;
    gap: 16px;
}

.myPost-menu-btn {
    display: flex;
    height: 32px;
    align-items: center;
    border-radius: 4px;
    background: var(--Gray-10, #F3F3F3);
    color: var(--Black, #333);
    text-align: center;
    font-size: 18px;
    font-weight: 400;
    padding: 0px 28px;
    cursor: pointer;
}

.myPost-menu-btn.active {
    background: var(--Blue-100, #5D91FE);
    color: var(--White, #FFF);
    font-weight: 600;
}

.myPost-sorts {
    position: absolute;
    top: 187px;
    right: 0px;
}

.myPost-sort {
    position: relative;
}

.myPost-sort-btn {
    border-radius: 4px;
    border: 1px solid var(--Blue-10, #DBE7FF);
    background: var(--White, #FFF);
    color: var(--Black, #333);
    text-align: center;
    font-size: 16px;
    font-style: normal;
    font-weight: 500;
    width: 98px;
    height: 35px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 4px;
    cursor: pointer;
    position: relative;
}

.myPost-sort-btn img {
    width: 16px;
    height: 16px;
}

.myPost-sort-drop {
    width: 143px;
    height: 140px;
    border-radius: 8px;
    background: var(--White, #FFF);
    position: absolute;
    top: 43px;
    right: 0;
    z-index: 1;
    box-shadow: 0px 1px 4px 0px rgba(0, 0, 0, 0.08);
    display: flex;
    flex-direction: column;
}

.myPost-sort-content {
    flex: 1 1;
    font-size: 16px;
    font-weight: 500;
    display: flex;
    align-items: center;
    cursor: pointer;
}

.myPost-sort-content img {
    width: 16px;
    height: 16px;
    margin-left: 21px;
    margin-right: 15px;
    opacity: 0;
}

.myPost-sort-content.active {
    color: var(--Blue-100, #5D91FE);
}

.myPost-sort-content.active img {
    opacity: 1;
}

.myPost-cards {
    position: relative;
    top: 265px;
}

.myPost-cardContainer {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    /* 가로 3개 */
    grid-template-rows: repeat(5, auto);
    /* 세로 5개 */
    gap: 0px 16px;
}

.myPost-card {
    width: 256px;
    height: 196px;
    border-radius: 8px;
    box-shadow: 0px 1px 12px 0px rgba(0, 0, 0, 0.04);
    color: var(--Black, #333);
    font-weight: 600;
    cursor: pointer;
    margin-bottom: 40px;
}

.myPost-card img {
    width: 100%;
    height: 102px;
    object-fit: cover;
    border-radius: 8px 8px 0px 0px;
}

.myPost-card-title {
    font-size: 12px;
    margin: 16px 20px 4px 20px;
}

.myPost-card-name {
    font-size: 16px;
    margin: 0px 20px 9px 20px;
}

.myPost-card-rest {
    color: #D8D8D8;
    display: flex;
    font-size: 12px;
    margin: 0px 20px;
    font-weight: 300;
}

.myPost-card-num,
.myPost-card-time {
    color: var(--Black, #333);
    font-size: 12px;
    font-weight: 500;
}

.myPost-paginations {
    position: relative;
    width: 244px;
    top: 300px;
    left: 50%;
    transform: translateX(-50%);
}

.myPost-pagination {
    display: flex;
    justify-content: space-between;
}

.myPost-pagination img {
    width: 28px;
    height: 28px;
}

.myPost-pagination-num {
    width: 28px;
    height: 28px;
    text-align: center;
    line-height: 28px;
    border-radius: var(--radius-small, 4px);
    font-size: 15px;
    font-weight: 500;
    color: var(--Gray-40, #989898);
    margin-bottom: 113px;
    cursor: pointer;
}

.myPost-pagination-num.active {
    background: var(--Gray-10, #F3F3F3);

    width: 40%;

    margin: 0 auto;
}

.check-password__title {
    font-size: 22px;
    font-weight: bold;
    margin-left: -120px;
    margin-bottom: 45px;
}

.check-password__subtitle {
    font-size: 22px;
    font-weight: bold;
    margin-bottom: 45px;
}

.check-password__label {
    font-size: 16px;
    font-weight: 600;
    margin-bottom: 6px;
}

.required {
    color: red;
}

.check-password__field {
    font-size: 16px;
    color: gray;
    font-weight: normal;
    margin-bottom: 6px;
}

.profile-field-container {
    margin-bottom: 25px;
}

.password-input-container {
    position: relative;
    width: 100%;
}

.password-input {
    width: 100%;
    border: 1px solid #D8D8D8;
    border-radius: 8px;
    padding: 15px;
    padding-right: 40px; /* 오른쪽 아이콘 공간 확보 */
    outline: none;
    box-sizing: border-box;
    font-family: 'Pretendard', sans-serif;
}

.password-toggle {
    position: absolute;
    right: 15px;
    top: 50%;
    transform: translateY(-50%);
    cursor: pointer;
    color: #8C8C8C;
    font-size: 18px;
}

.check-password__error {
    color: red;
    font-size: 14px;
    margin-top: 7px;
    margin-bottom: 25px;
}

.check-password__button {
    width: 100%;
    border-radius: 6px;
    background-color: #F5F7FA;

    margin-top: 20px;
    padding: 16px;
    font-family: 'Pretendard', sans-serif;
    font-size: 18px;
    font-weight: bold;
    cursor: not-allowed;
    transition: background-color 0.3s;
}

.check-password__button.active {
    background-color: #5D91FE;
    color: white;
    cursor: pointer;
}
